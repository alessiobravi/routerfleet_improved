name: Migration timing

# Started by hand only (Actions -> Migration timing -> Run workflow): how long
# the automatic move of a PostgreSQL 16 database to PostgreSQL 18 takes, and
# how much disk it uses, on databases of realistic size - years of backups, a
# long audit log and availability history. The CI checks the move on a small
# database; this measures it. Publishes nothing: the numbers are in the run's
# summary.

on:
  workflow_dispatch:
    inputs:
      sizes:
        description: 'Database sizes in GB, as a JSON list'
        default: '[1, 5]'
        required: true
      devices:
        description: 'Devices the backups are spread over'
        default: '200'
        required: true

permissions:
  contents: read

jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        size_gb: ${{ fromJSON(inputs.sizes) }}
    env:
      SIZE_GB: ${{ matrix.size_gb }}
      RF_DEVICES: ${{ inputs.devices }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Inputs are numbers
        run: |
          [[ "$SIZE_GB" =~ ^[0-9]+$ ]] && [ "$SIZE_GB" -ge 1 ] && [ "$SIZE_GB" -le 20 ] || { echo "size: 1 to 20 GB"; exit 1; }
          [[ "$RF_DEVICES" =~ ^[0-9]+$ ]] && [ "$RF_DEVICES" -ge 1 ] && [ "$RF_DEVICES" -le 5000 ] || { echo "devices: 1 to 5000"; exit 1; }

      # The move needs about three times the database free, beside the images
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune -af >/dev/null
          df -h /

      - name: Environment
        run: |
          {
            echo "SERVER_ADDRESS=localhost"
            echo "DEBUG_MODE=False"
            echo "TIMEZONE=Etc/UTC"
            echo "DATABASE_ENGINE=postgres"
            echo "POSTGRES_DB=routerfleet"
            echo "POSTGRES_USER=routerfleet"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "HTTPS_REDIRECT_POLICY=always"
          } > .env
          VALUE="$(openssl rand -hex 16)"
          echo "::add-mask::$VALUE"
          echo "RF_TEST_DEVICE_PW=$VALUE" >> "$GITHUB_ENV"

      - name: Build the images
        run: |
          docker compose -f docker-compose-dev.yml build routerfleet-postgres routerfleet
          docker build -t routerfleet-dev/routerfleet-postgres:local -f containers/postgres/Dockerfile-postgres containers/postgres

      - name: A PostgreSQL 16 database of an earlier release, grown to the size
        run: |
          set -eu
          set -a; . ./.env; set +a
          PROJECT="$(docker compose -f docker-compose-dev.yml config --format json | jq -r .name)"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          docker network create rf-old
          docker run -d --name old-db --network rf-old -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD \
            -v "${PROJECT}_postgres_data:/var/lib/postgresql/data" routerfleet-dev/routerfleet-postgres:local
          for _ in $(seq 1 60); do docker exec old-db pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" && break; sleep 2; done
          docker run --rm --network rf-old -e SERVER_ADDRESS=localhost -e DEBUG_MODE=False -e DATABASE_ENGINE=postgres \
            -e POSTGRES_HOST=old-db -e POSTGRES_PORT=5432 -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD \
            -e COMPOSE_VERSION=08a -e COMPOSE_TYPE=no-postgres -v "${PROJECT}_app_secrets:/app_secrets" \
            -e RF_TEST_DEVICE_PW -e RF_DEVICES -v "$PWD/.github/migration-timing:/timing:ro" \
            routerfleet-dev/routerfleet:local bash -c 'python manage.py migrate --noinput -v0 && python manage.py shell -v0 < /timing/templates.py'
          SECONDS=0
          docker exec -i old-db psql -X -q -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v target_mb="$((SIZE_GB * 1024))" -v audit_rows=5000 -v downtime_per_device=500 < .github/migration-timing/seed.sql
          echo "seeded in ${SECONDS} s"
          docker exec old-db psql -X -q -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT pg_database_size(current_database())" > db_bytes
          # Stopped cleanly, as an installation is before it is updated
          docker stop -t 300 old-db && docker rm old-db
          docker network rm rf-old
          docker run --rm -v "${PROJECT}_postgres_data:/old:ro" --entrypoint du routerfleet-dev/routerfleet-postgres:local -sk /old | cut -f1 > old_kb
          df -h /

      - name: The move, timed
        run: |
          set -eu
          used() { df -Pk / | awk 'NR == 2 {print $3}'; }
          used before > used_before
          ( while :; do used; sleep 2; done ) > used.log &
          SAMPLER=$!
          # Whether the health check ever gave up during the move: then compose
          # would not start RouterFleet behind it
          ( while :; do docker inspect -f '{{.State.Health.Status}}' routerfleet-postgres 2>/dev/null || true; sleep 5; done ) > health.log &
          WATCH=$!
          START=$(date +%s)
          docker compose -f docker-compose-dev.yml up -d routerfleet-postgres
          RESULT=timeout
          for _ in $(seq 1 8640); do
            LOG="$(docker logs routerfleet-postgres 2>&1 || true)"
            if grep -q "RouterFleet: moved:" <<< "$LOG"; then RESULT=moved; break; fi
            if grep -q "MOVE STOPPED\|did not complete" <<< "$LOG"; then RESULT=failed; break; fi
            sleep 2
          done
          MOVED=$(date +%s)
          HEALTHY=""
          for _ in $(seq 1 600); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' routerfleet-postgres)" = healthy ] && { HEALTHY=$(date +%s); break; }
            sleep 1
          done
          kill "$SAMPLER" "$WATCH"
          docker logs -t routerfleet-postgres 2>&1 | grep "RouterFleet:" | tee phases.log
          {
            echo "RESULT=$RESULT"
            echo "MOVE_S=$((MOVED - START))"
            echo "HEALTHY_S=${HEALTHY:+$((HEALTHY - START))}"
            echo "UNHEALTHY_SEEN=$(grep -qx unhealthy health.log && echo yes || echo no)"
            echo "PEAK_EXTRA_KB=$(( $(sort -n used.log | tail -1) - $(cat used_before) ))"
          } | tee -a "$GITHUB_ENV"
          [ "$RESULT" = moved ]

      - name: RouterFleet starts on the moved database, every backup there
        run: |
          set -eu
          docker compose -f docker-compose-dev.yml up -d --wait --wait-timeout 900
          set -a; . ./.env; set +a
          docker exec routerfleet-postgres psql -X -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c \
            "SELECT pg_size_pretty(pg_database_size(current_database())) AS size, (SELECT count(*) FROM backup_data_routerbackup) AS backups, (SELECT count(*) FROM audit_log_changerecord) AS audit_rows, (SELECT count(*) FROM monitoring_routerdowntime) AS downtime_rows" | tee counts.txt
          docker run --rm -v "${PROJECT}_postgres18_data:/new:ro" --entrypoint du routerfleet-dev/routerfleet-postgres:local -sk /new | cut -f1 > new_kb

      - name: Summary
        if: always()
        run: |
          mb() { [ -s "$1" ] && echo "$(( $(cat "$1") / 1024 )) MB" || echo "?"; }
          {
            echo "## PostgreSQL 16 -> 18 move, ${SIZE_GB} GB target, ${RF_DEVICES} devices"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Result | ${RESULT:-not reached} |"
            echo "| Database (PostgreSQL 16, pg_database_size) | $([ -s db_bytes ] && echo "$(( $(cat db_bytes) / 1048576 )) MB" || echo "?") |"
            echo "| Old volume on disk | $(mb old_kb) |"
            echo "| New volume on disk | $(mb new_kb) |"
            echo "| **Move time** (start to \"moved\") | **${MOVE_S:-?} s** |"
            echo "| Healthy after | ${HEALTHY_S:-not within the wait} s (health check allows 900 s + 50 s) |"
            echo "| Marked unhealthy during the move | ${UNHEALTHY_SEEN:-?} |"
            echo "| Peak extra disk during the move | $([ -n "${PEAK_EXTRA_KB:-}" ] && echo "$((PEAK_EXTRA_KB / 1024)) MB" || echo "?") |"
            echo ""
            echo "### Phases (container log, timestamped)"
            echo '```'
            cat phases.log 2>/dev/null || true
            echo '```'
            echo '```'
            cat counts.txt 2>/dev/null || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Stop
        if: always()
        run: docker compose -f docker-compose-dev.yml down -v
