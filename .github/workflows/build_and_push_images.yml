name: CI

# Every push to main is a release: tests, then images tagged with the version,
# then a tag and a GitHub Release, then the untagged image versions earlier
# builds left behind are removed. Pull requests only run the tests.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TRIVY_VERSION: 0.76.2

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request makes the older run pointless. On main a
  # release is never interrupted halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Version and changelog
        id: version
        run: |
          python scripts/version.py check
          echo "version=$(python scripts/version.py)" >> "$GITHUB_OUTPUT"

      - name: The release must be above every earlier one
        if: github.event_name == 'push'
        run: |
          # shellcheck disable=SC2046
          python scripts/version.py newer-than $(git ls-remote --tags --refs origin | awk '{print $2}')

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # In the container entrypoint.sh writes this file; the tests need one too
      - name: Write test settings
        run: |
          cat > routerfleet/production_settings.py <<PY
          DEBUG = False
          ALLOWED_HOSTS = ['testserver', 'localhost']
          SECRET_KEY = '$(python -c "import secrets; print(secrets.token_urlsafe(48))")'
          DATABASES = {'default': {'ENGINE': 'django.db.backends.sqlite3', 'NAME': 'test.sqlite3'}}
          MONITORING_KEY = 'ci-monitoring-key'
          PY

      - name: System check and migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Test suite
        run: coverage run manage.py test

      - name: Coverage
        run: coverage report

      # A typo in an nginx config still builds into an image; it only fails when
      # the container starts. Both configs are checked in the real image.
      - name: nginx configuration
        run: |
          mkdir -p /tmp/cert
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=localhost" \
            -keyout /tmp/cert/nginx.key -out /tmp/cert/nginx.pem 2> /dev/null
          for CONF in virtualhost.conf virtualhost_noredirect.conf; do
            docker run --rm --add-host routerfleet:127.0.0.1 \
              -v /tmp/cert:/certificate:ro \
              -v "$PWD/containers/nginx/${CONF}:/etc/nginx/conf.d/default.conf:ro" \
              nginx:alpine nginx -t
          done

  # The whole stack, built from this commit and started the way an installation
  # starts it. Images are only published when it comes up healthy and behaves.
  stack:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Environment
        run: |
          {
            echo "SERVER_ADDRESS=localhost"
            echo "DEBUG_MODE=False"
            echo "TIMEZONE=Etc/UTC"
            echo "DATABASE_ENGINE=postgres"
            echo "POSTGRES_DB=routerfleet"
            echo "POSTGRES_USER=routerfleet"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "HTTPS_REDIRECT_POLICY=always"
          } > .env

      - name: Every compose file is valid
        run: |
          for FILE in docker-compose.yml docker-compose-no-postgres.yml docker-compose-dev.yml docker-compose-build.yml; do
            docker compose -f "${FILE}" config --quiet && echo "${FILE}: valid"
          done

      - name: Build and start, waiting for the healthchecks
        run: docker compose -f docker-compose-dev.yml up -d --build --wait --wait-timeout 300

      - name: The installation behaves
        run: |
          set -x
          # Port 80 redirects to HTTPS. The healthchecks already waited for
          # nginx to listen; a short retry covers the moment between the two.
          for _ in $(seq 1 15); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/ || true)
            [ "${CODE}" != "000" ] && break
            sleep 2
          done
          test "${CODE}" = "301"
          # Captured first and matched after: piping curl into grep -q under
          # pipefail fails whenever grep stops reading early
          # The sign-in flow renders; on an empty install it leads to the first-user page
          PAGE=$(curl -fsSkL https://localhost/accounts/login/)
          grep -q 'csrfmiddlewaretoken' <<< "${PAGE}"
          # The scheduler endpoints are not reachable from outside
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/cron/housekeeping/)" = "404"
          # Static files, including the bundled font, are served with nosniff
          FONT=$(curl -fsSk -D - -o /dev/null https://localhost/static/fonts/source-sans-pro/SourceSansPro-Regular.woff2)
          grep -qi '^x-content-type-options: nosniff' <<< "${FONT}"
          # nginx does not announce its version (an if, because set -e ignores "! command")
          HOME_HEADERS=$(curl -sSk -D - -o /dev/null https://localhost/)
          if grep -qiE '^server: nginx/[0-9]' <<< "${HOME_HEADERS}"; then
            echo "::error::nginx announces its version"; exit 1
          fi

      - name: The scheduler reaches the application
        run: |
          for _ in $(seq 1 18); do
            LOGS=$(docker compose -f docker-compose-dev.yml logs routerfleet 2>/dev/null)
            if grep -q 'GET /cron/' <<< "${LOGS}"; then
              echo "cron calls arrive"; exit 0
            fi
            sleep 5
          done
          echo "::error::no /cron/ request reached the application within 90 seconds"
          exit 1

      - name: Install Trivy
        run: scripts/install_trivy.sh "$HOME/.local/bin"

      # The release gate. RouterFleet's own images: no critical or high
      # vulnerability, fixed or not. The database image: none with a published
      # fix, whatever its severity - the ones Debian has not fixed are reported
      # in the release notes instead. Medium and low findings never block a
      # release; they are listed in its notes.
      - name: Vulnerability gate - RouterFleet images
        run: |
          for IMAGE in routerfleet routerfleet-cron routerfleet-monitoring routerfleet-nginx; do
            trivy image --quiet --scanners vuln --severity CRITICAL,HIGH --exit-code 1 \
              "routerfleet-dev/${IMAGE}:local"
            echo "routerfleet-dev/${IMAGE}:local: no critical or high vulnerability"
          done

      - name: Vulnerability gate - database image
        run: |
          trivy image --quiet --scanners vuln --ignore-unfixed --exit-code 1 \
            routerfleet-dev/routerfleet-postgres:local
          echo "routerfleet-postgres: no vulnerability with a published fix"

      # Python requirements, the browser-library manifest, and any secret that
      # should never have been committed
      - name: Vulnerability and secret gate - repository
        run: |
          trivy fs --quiet --scanners vuln,secret --severity CRITICAL,HIGH --exit-code 1 .
          echo "repository: no critical or high vulnerability, no secret"

      - name: Full report
        if: always()
        run: |
          {
            echo "## Vulnerabilities, all severities"
            for IMAGE in routerfleet routerfleet-cron routerfleet-monitoring routerfleet-nginx routerfleet-postgres; do
              echo "### ${IMAGE}"
              echo '```'
              trivy image --quiet --scanners vuln --format table "routerfleet-dev/${IMAGE}:local" || true
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logs
        if: always()
        run: docker compose -f docker-compose-dev.yml ps -a && docker compose -f docker-compose-dev.yml logs --tail 60

      - name: Stop
        if: always()
        run: docker compose -f docker-compose-dev.yml down -v

  images:
    needs: [test, stack]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: routerfleet
            context: .
            file: ./Dockerfile
            title: RouterFleet Improved application
          - image: routerfleet-cron
            context: ./containers/cron
            file: ./containers/cron/Dockerfile-cron
            title: RouterFleet Improved scheduler
          - image: routerfleet-monitoring
            context: ./containers/monitoring
            file: ./containers/monitoring/Dockerfile-monitoring
            title: RouterFleet Improved monitoring
          - image: routerfleet-nginx
            context: ./containers/nginx
            file: ./containers/nginx/Dockerfile-nginx
            title: RouterFleet Improved web server
          - image: routerfleet-postgres
            context: ./containers/postgres
            file: ./containers/postgres/Dockerfile-postgres
            title: RouterFleet Improved database
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # arm64 is built under emulation on the amd64 runner
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags and OCI labels. The source label is what links the package to this
      # repository, so it is listed on the repository page.
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/alessiobravi/${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.test.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=Centralized backup, configuration management and fleet command execution for network devices
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ needs.test.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # One index per release with a manifest per platform, and no
          # attestation manifests beside them
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false

  release:
    needs: [test, images]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Trivy
        run: scripts/install_trivy.sh "$HOME/.local/bin"

      - name: Scan the published images
        env:
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          for IMAGE in routerfleet routerfleet-cron routerfleet-monitoring routerfleet-nginx routerfleet-postgres; do
            trivy image --quiet --scanners vuln --image-src remote --platform linux/amd64 \
              --format json --output "scan-${IMAGE}.json" "ghcr.io/alessiobravi/${IMAGE}:${VERSION}"
          done

      - name: Tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          python scripts/version.py notes > release-notes.md
          {
            echo
            python scripts/cve_report.py "${TRIVY_VERSION}" scan-routerfleet.json scan-routerfleet-cron.json \
              scan-routerfleet-monitoring.json scan-routerfleet-nginx.json scan-routerfleet-postgres.json
          } >> release-notes.md
          gh release create "v${VERSION}" --target "${GITHUB_SHA}" \
            --title "RouterFleet Improved ${VERSION}" --notes-file release-notes.md

      # Only vMAJOR.MINOR.PATCH releases and tags are kept
      - name: Remove releases and tags that are not vMAJOR.MINOR.PATCH
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG='^v[0-9]+\.[0-9]+\.[0-9]+$'
          gh release list --limit 1000 --json tagName --jq '.[].tagName' | while read -r TAG; do
            if ! [[ "${TAG}" =~ ${RELEASE_TAG} ]]; then
              gh release delete "${TAG}" --cleanup-tag --yes
              echo "removed release ${TAG}"
            fi
          done
          git ls-remote --tags --refs origin | awk '{print $2}' | sed 's#^refs/tags/##' | while read -r TAG; do
            if ! [[ "${TAG}" =~ ${RELEASE_TAG} ]]; then
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}"
              echo "removed tag ${TAG}"
            fi
          done

  cleanup:
    needs: [test, images]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [routerfleet, routerfleet-cron, routerfleet-monitoring, routerfleet-nginx, routerfleet-postgres]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Keeps every release-tagged version and every per-platform manifest
      # those reference; deletes nothing if anything looks wrong
      - name: Delete image versions no release needs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prune_images.py "${{ matrix.image }}" "${{ needs.test.outputs.version }}"
