services:
  routerfleet:
    image: ghcr.io/alessiobravi/routerfleet:latest
    build:
      context: .

  routerfleet-cron:
    image: ghcr.io/alessiobravi/routerfleet-cron:latest
    build:
      context: ./containers/cron
      dockerfile: Dockerfile-cron

  routerfleet-monitoring:
    image: ghcr.io/alessiobravi/routerfleet-monitoring:latest
    build:
      context: ./containers/monitoring
      dockerfile: Dockerfile-monitoring

  routerfleet-discovery:
    image: ghcr.io/alessiobravi/routerfleet-discovery:latest
    profiles: ["discovery"]
    build:
      context: ./containers/discovery
      dockerfile: Dockerfile-discovery
  routerfleet-nginx:
    image: ghcr.io/alessiobravi/routerfleet-nginx:latest
    build:
      context: ./containers/nginx
      dockerfile: Dockerfile-nginx

  routerfleet-postgres:
    image: ghcr.io/alessiobravi/routerfleet-postgres18:latest
    build:
      context: ./containers/postgres18
      dockerfile: Dockerfile-postgres18

  # The PostgreSQL 16 image, still published for compose files from before 0.24
  routerfleet-postgres16:
    image: ghcr.io/alessiobravi/routerfleet-postgres:latest
    build:
      context: ./containers/postgres
      dockerfile: Dockerfile-postgres
