services:
  routerfleet:
    container_name: routerfleet
    restart: unless-stopped
    image: ghcr.io/alessiobravi/routerfleet:latest
    environment:
      - SERVER_ADDRESS=${SERVER_ADDRESS}
      - DEBUG_MODE=${DEBUG_MODE}
      - HTTPS_REDIRECT_POLICY=${HTTPS_REDIRECT_POLICY}
      - UPDATE_CHECK=${UPDATE_CHECK}
      - DATABASE_ENGINE=${DATABASE_ENGINE}
      - POSTGRES_HOST=${POSTGRES_HOST:-}
      - POSTGRES_PORT=${POSTGRES_PORT:-}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=${TIMEZONE}
      - COMPOSE_VERSION=08a
      - COMPOSE_TYPE=no-postgres
    # Reachable from this host only (127.0.0.1 and ::1), for the monitoring container on
    # the host's network; never from the network
    ports:
      - "127.0.0.1:${MONITORING_PORT:-8001}:8001"
      - "[::1]:${MONITORING_PORT:-8001}:8001"
    volumes:
      - sqlite_volume:/var/lib/routerfleet_sqlite/
      - media_root:/var/lib/routerfleet/
      # The discovery listener's requests, state and findings
      - discovery_data:/discovery
      - static_volume:/app_static_files/
      - app_secrets:/app_secrets/
      # Shared with nginx: HTTPS in System settings writes the mode and certificates here
      - https_cert:/certificate
    command: /bin/bash /app/init.sh
    healthcheck:
      # gunicorn answering a real page - migrations done, workers up
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/accounts/login/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Migrations of a large database can take a while on the first start
      start_period: 180s

  routerfleet-cron:
    container_name: routerfleet-cron
    restart: unless-stopped
    image: ghcr.io/alessiobravi/routerfleet-cron:latest
    environment:
      - TZ=${TIMEZONE}
    depends_on:
      routerfleet:
        condition: service_healthy

  routerfleet-monitoring:
    container_name: routerfleet-monitoring
    restart: unless-stopped
    image: ghcr.io/alessiobravi/routerfleet-monitoring:latest
    environment:
      - TZ=${TIMEZONE}
      # The application on the host's loopback (this container is on the host's network)
      - MONITORING_API=http://127.0.0.1:${MONITORING_PORT:-8001}
    # The host's network, for the discovery listener (LLDP, CDP, MNDP do not
    # cross Docker's network); every right dropped but the raw socket, which
    # ping (fping) and the listener need. The listener is dormant until
    # "Discover adjacent devices" asks; it sends nothing.
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    volumes:
      - app_secrets:/app_secrets/
      - discovery_data:/discovery
    depends_on:
      routerfleet:
        condition: service_healthy

  routerfleet-nginx:
    container_name: routerfleet-nginx
    restart: unless-stopped
    image: ghcr.io/alessiobravi/routerfleet-nginx:latest
    environment:
      - HTTPS_REDIRECT_POLICY=${HTTPS_REDIRECT_POLICY}
      - TZ=${TIMEZONE}
      # The HTTPS port on the host, for the HTTP redirect (see ports below)
      - HTTPS_PORT=${HTTPS_PORT:-443}
      # Emergency override of System settings -> HTTPS (env or selfsigned)
      - HTTPS_MODE_OVERRIDE=${HTTPS_MODE_OVERRIDE:-}
      # 1: Let's Encrypt's test service
      - LETSENCRYPT_STAGING=${LETSENCRYPT_STAGING:-}
    volumes:
      - static_volume:/static
      - https_cert:/certificate
    ports:
      # The ports on the host: HTTP_PORT and HTTPS_PORT in .env
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    healthcheck:
      # Listening on 443 - which on a first start is only after the
      # self-signed certificate has been generated. Read from the kernel's
      # socket table, so it needs no tool the image does not have.
      test: ["CMD-SHELL", "grep -qE ': ?01BB +00000000:0000 +0A' /proc/net/tcp"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      routerfleet:
        condition: service_healthy

# Dual stack: RouterFleet's own network has IPv6 beside IPv4 (a fixed private
# ULA prefix), so every container has both. On a host whose kernel has IPv6
# switched off, set IPV6=false in .env.
networks:
  default:
    name: routerfleet_dualstack
    enable_ipv6: ${IPV6:-true}
    ipam:
      config:
        - subnet: fd72:6674:6c74::/64

volumes:
  discovery_data:
  static_volume:
  https_cert:
  media_root:
  postgres_data:
  sqlite_volume:
  app_secrets:
