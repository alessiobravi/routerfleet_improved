services:
  routerfleet:
    container_name: routerfleet
    restart: unless-stopped
    image: ghcr.io/alessiobravi/routerfleet:latest
    environment:
      - SERVER_ADDRESS=${SERVER_ADDRESS}
      - DEBUG_MODE=${DEBUG_MODE}
      - HTTPS_REDIRECT_POLICY=${HTTPS_REDIRECT_POLICY}
      - UPDATE_CHECK=${UPDATE_CHECK}
      - DATABASE_ENGINE=${DATABASE_ENGINE}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=${TIMEZONE}
      - COMPOSE_VERSION=08a
      - COMPOSE_TYPE=no-postgres
    volumes:
      - sqlite_volume:/var/lib/routerfleet_sqlite/
      - media_root:/var/lib/routerfleet/
      - static_volume:/app_static_files/
      - app_secrets:/app_secrets/
      # Shared with nginx: HTTPS in System settings writes the mode and certificates here
      - https_cert:/certificate
      # Update requests to the scheduler's updater (System settings)
      - update_requests:/update
    command: /bin/bash /app/init.sh
    healthcheck:
      # gunicorn answering a real page - migrations done, workers up
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/accounts/login/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Migrations of a large database can take a while on the first start
      start_period: 180s

  routerfleet-cron:
    container_name: routerfleet-cron
    restart: unless-stopped
    image: ghcr.io/alessiobravi/routerfleet-cron:latest
    environment:
      - TZ=${TIMEZONE}
    # Updates approved in System settings (docs/updating.md). Only the
    # scheduler's updater has Docker access - the application has none; it
    # asks through the update_requests volume, and only signed releases of
    # RouterFleet Improved are installed. Remove these four lines to update by
    # command only.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/compose:ro
      - update_requests:/update
      - update_private:/update-private
    depends_on:
      routerfleet:
        condition: service_healthy

  routerfleet-monitoring:
    container_name: routerfleet-monitoring
    restart: unless-stopped
    image: ghcr.io/alessiobravi/routerfleet-monitoring:latest
    environment:
      - TZ=${TIMEZONE}
    volumes:
      - app_secrets:/app_secrets/
    depends_on:
      routerfleet:
        condition: service_healthy

  routerfleet-nginx:
    container_name: routerfleet-nginx
    restart: unless-stopped
    image: ghcr.io/alessiobravi/routerfleet-nginx:latest
    environment:
      - HTTPS_REDIRECT_POLICY=${HTTPS_REDIRECT_POLICY}
      - TZ=${TIMEZONE}
    volumes:
      - static_volume:/static
      - https_cert:/certificate
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      # Listening on 443 - which on a first start is only after the
      # self-signed certificate has been generated. Read from the kernel's
      # socket table, so it needs no tool the image does not have.
      test: ["CMD-SHELL", "grep -qE ': ?01BB +00000000:0000 +0A' /proc/net/tcp"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      routerfleet:
        condition: service_healthy

volumes:
  static_volume:
  https_cert:
  media_root:
  postgres_data:
  sqlite_volume:
  app_secrets:
  update_requests:
  update_private:
