zabbix_export:
  version: '8.0'
  template_groups:
    - uuid: c6a5846ceb4149ed9df893626b821e01
      name: Templates/Applications
  templates:
    - uuid: 046b14e41b1f40afa1f0a1fc40e45cf8
      template: 'RouterFleet by Zabbix agent'
      name: 'RouterFleet by Zabbix agent'
      description: |
        Monitors a RouterFleet installation through the Zabbix agent on the
        Docker host, reading the RouterFleet PostgreSQL database with a
        read-only role.

        Requires scripts/zbx-routerfleet.sh and agent/routerfleet.conf from the
        same distribution, and the zbx_monitor role created by sql/zbx_monitor.sql.

        The authoritative health signal is backup AGE, not backup RESULT.
        RouterFleet does not backfill a missed backup, so a growing age always
        means backups are not completing. A backup whose content is not stored
        again because it did not change still records its finish_time, so this
        signal is unaffected. See docs/design-notes.md.
      groups:
        - name: Templates/Applications
      items:
        - uuid: d7c3f7250a1c41bf89428bcfdeae17db
          name: 'RouterFleet: collector probe'
          key: routerfleet.probe
          delay: 5m
          history: 7d
          trends: '0'
          description: |
            1 when the collector reached the RouterFleet database, 0 otherwise.
            Without this item a broken collector is indistinguishable from a
            healthy fleet: every other item simply stops changing.
          valuemap:
            name: 'Probe result'
          tags:
            - tag: component
              value: routerfleet
        - uuid: bece741102f84e03a84da6bfccc14256
          name: 'RouterFleet: monitored routers'
          key: routerfleet.routers
          delay: 10m
          history: 31d
          trends: 365d
          description: 'Enabled routers that have a backup profile assigned.'
          tags:
            - tag: component
              value: routerfleet
        - uuid: cd9169b3c6394a26995e845055f402d3
          name: 'RouterFleet: routers with a failing backup'
          key: routerfleet.failing
          delay: 10m
          history: 31d
          trends: 365d
          description: |
            Routers whose most recent backup ATTEMPT failed, counted fleet-wide.
            Useful as a single number for a dashboard; the per-router triggers
            say which device is affected.
          tags:
            - tag: component
              value: routerfleet
        - uuid: 52d9a1cb10b04c499ed454cf3cb2f67c
          name: 'RouterFleet: routers without a recorded SSH host key'
          key: routerfleet.hostkeys.missing
          delay: 10m
          history: 31d
          trends: 365d
          description: |
            Enabled routers with a backup profile that have no host key on
            record. RouterFleet Improved learns each device's key on first
            contact and refuses to connect if it later changes.

            A router here has either never been reached, or had its key
            forgotten by an administrator. The first is a connectivity problem
            the backup-age triggers will also show; the second is deliberate
            and should match a planned replacement.
          tags:
            - tag: component
              value: routerfleet
            - tag: scope
              value: security
        - uuid: ccb67899b78c40d0b3a07d9c51c132ac
          name: 'RouterFleet: host keys learned in the last hour'
          key: routerfleet.hostkeys.new
          delay: 10m
          history: 31d
          trends: 365d
          description: |
            On a settled fleet this is 0. A key appearing for a device that has
            been managed for a while means the old key was forgotten and a new
            one accepted - so the device was rebuilt, replaced, or is not the
            device you think it is.
          tags:
            - tag: component
              value: routerfleet
            - tag: scope
              value: security
        - uuid: cc40d09463ac47488219117b0499d3d0
          name: 'RouterFleet: failed sign-ins in the last 15 minutes'
          key: routerfleet.logins.failed
          delay: 5m
          history: 31d
          trends: 365d
          description: |
            Failed sign-ins across all accounts and source addresses, from
            RouterFleet's audit log.

            RouterFleet locks an account or an address after 5 failures within
            15 minutes, so a value that stays high means something is still
            trying against other accounts or from other addresses.
          tags:
            - tag: component
              value: routerfleet
            - tag: scope
              value: security
        - uuid: 8122b8f98b854e0ca37be91b025fda5a
          name: 'RouterFleet: audited changes in the last hour'
          key: routerfleet.changes.recent
          delay: 10m
          history: 31d
          trends: 365d
          description: |
            Configuration changes recorded in the audit log. Informational: on
            a fleet that changes rarely, this sits near zero and an unexpected
            burst becomes visible without anyone having to go looking.
          tags:
            - tag: component
              value: routerfleet
        - uuid: 31ed81b9c7e1430398074c37f10fa98e
          name: 'RouterFleet: command jobs with failures (24h)'
          key: routerfleet.commands.failed
          delay: 10m
          history: 31d
          trends: 365d
          description: 'Fleet Commander jobs completed in the last 24 hours in which at least one task errored or was aborted.'
          tags:
            - tag: component
              value: routerfleet
      discovery_rules:
        - uuid: 86d2fdb8c6ea47e6a70d1100913668a8
          name: 'RouterFleet routers'
          key: routerfleet.backup.discovery
          delay: 1h
          lifetime: 7d
          description: |
            Discovers enabled routers that have a backup profile. A router
            without a profile is not meant to be backed up, so discovering it
            would create an item that is permanently and correctly stale.
          item_prototypes:
            - uuid: 714464e87d034064b9acf3978f9d9253
              name: 'RouterFleet backup age: {#ROUTER}'
              key: 'routerfleet.backup.age[{#UUID}]'
              delay: 10m
              history: 90d
              trends: 365d
              units: s
              description: |
                Seconds since the last SUCCESSFUL backup of this router.
                999999999 means no successful backup is on record.
              tags:
                - tag: component
                  value: routerfleet
                - tag: router
                  value: '{#ROUTER}'
            - uuid: 5430c69d3adc43c88cfb0f0581a5b23b
              name: 'RouterFleet backup result: {#ROUTER}'
              key: 'routerfleet.backup.result[{#UUID}]'
              delay: 10m
              history: 90d
              trends: '0'
              description: |
                1 when the most recent backup ATTEMPT succeeded, 0 when it failed.
                Read docs/design-notes.md before changing the underlying query:
                the obvious ordering makes this item permanently report success.
              valuemap:
                name: 'Backup result'
              tags:
                - tag: component
                  value: routerfleet
                - tag: router
                  value: '{#ROUTER}'
          trigger_prototypes:
            - uuid: 67de743928644b0fabd721e74f774457
              expression: 'last(/RouterFleet by Zabbix agent/routerfleet.backup.age[{#UUID}])>{$ROUTERFLEET.BACKUP.MAX_AGE}'
              name: 'RouterFleet: backup stale on {#ROUTER}'
              priority: WARNING
              description: |
                No successful backup within the allowed window. This is the
                reliable failure signal: RouterFleet never backfills, so the
                age only stops growing when a backup actually completes. A
                backup that was unchanged, and so not stored again, still
                records a finish_time and still counts.
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: backup
            - uuid: 12ca06d5769d4cc2a7864ddb41ac6b6f
              expression: 'last(/RouterFleet by Zabbix agent/routerfleet.backup.age[{#UUID}])>{$ROUTERFLEET.BACKUP.MAX_AGE.CRIT}'
              name: 'RouterFleet: backup critically stale on {#ROUTER}'
              priority: HIGH
              description: 'Backups have been failing long enough that the stored configuration is no longer a usable recovery point.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: backup
            - uuid: c55b733f97744babb988a63b7a25898d
              expression: 'last(/RouterFleet by Zabbix agent/routerfleet.backup.result[{#UUID}])=0'
              name: 'RouterFleet: last backup attempt failed on {#ROUTER}'
              priority: AVERAGE
              description: |
                The most recent attempt failed. A single failure is not yet a
                data-loss risk - the staleness triggers cover that - but a
                device failing every night will trip this long before the
                48-hour window elapses.
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: backup
      valuemaps:
        - uuid: 2abb55311884487a90b3e3eb9e93629c
          name: 'Probe result'
          mappings:
            - value: '0'
              newvalue: 'Not working'
            - value: '1'
              newvalue: 'Working'
        - uuid: d7b8360940344a7ea46c566985dac873
          name: 'Backup result'
          mappings:
            - value: '0'
              newvalue: 'Failed'
            - value: '1'
              newvalue: 'Succeeded'
      macros:
        - macro: '{$ROUTERFLEET.LOGINS.FAILED.MAX}'
          value: '5'
          description: 'Sustained failed sign-ins over 15 minutes that counts as an attack rather than a forgotten password.'
        - macro: '{$ROUTERFLEET.BACKUP.MAX_AGE}'
          value: 48h
          description: 'Age beyond which a router backup counts as stale.'
        - macro: '{$ROUTERFLEET.BACKUP.MAX_AGE.CRIT}'
          value: 7d
          description: 'Age beyond which the stored configuration is no longer a usable recovery point.'
  triggers:
    - uuid: 9e44a2bf7002455e8c41f553abcd5a64
      expression: 'last(/RouterFleet by Zabbix agent/routerfleet.hostkeys.new)>0'
      name: 'RouterFleet: a device SSH host key was newly accepted on {HOST.NAME}'
      priority: WARNING
      manual_close: 'YES'
      description: |
        A host key was learned in the last hour. If a device was deliberately
        rebuilt or replaced, close this. If nobody can account for it, the
        device presenting that key is not the one previously trusted, and the
        change should be investigated before any credential is sent to it.
      tags:
        - tag: scope
          value: security
    - uuid: 2c4c1a89b0bd414fad212b7bbc5eebe4
      expression: 'min(/RouterFleet by Zabbix agent/routerfleet.logins.failed,15m)>={$ROUTERFLEET.LOGINS.FAILED.MAX}'
      name: 'RouterFleet: repeated failed sign-ins on {HOST.NAME}'
      priority: AVERAGE
      manual_close: 'YES'
      description: |
        Failed sign-ins have stayed at or above the threshold for a full 15
        minutes. One burst is a forgotten password; a sustained level means
        something is working through accounts or addresses, and the per-account
        lockout is not stopping it.
      tags:
        - tag: scope
          value: security
    - uuid: 6fc5b82494814c3b83b60d605db8c9b5
      expression: 'min(/RouterFleet by Zabbix agent/routerfleet.hostkeys.missing,24h)>0'
      name: 'RouterFleet: a router has had no SSH host key for 24h on {HOST.NAME}'
      priority: WARNING
      manual_close: 'YES'
      description: |
        A router with a backup profile has gone a full day without a host key
        being recorded, so RouterFleet has not completed a connection to it in
        that time. Expect the backup-age triggers to be firing for the same
        device; this says specifically that the connection, not the backup, is
        what is failing.
      tags:
        - tag: scope
          value: availability
    - uuid: 45036fcacab74b5fabc30167c7f7db9b
      expression: 'last(/RouterFleet by Zabbix agent/routerfleet.commands.failed)>0'
      name: 'RouterFleet: command jobs failed in the last 24h on {HOST.NAME}'
      priority: WARNING
      manual_close: 'YES'
      description: 'At least one Fleet Commander job completed with a failed or aborted task. The job detail page says which device and why.'
      tags:
        - tag: scope
          value: availability
    - uuid: 25df1dc920164755868bacec432bd896
      expression: 'last(/RouterFleet by Zabbix agent/routerfleet.probe)=0'
      name: 'RouterFleet: monitoring collector is not working'
      priority: HIGH
      description: |
        The collector could not query the RouterFleet database. Every other
        item on this template is therefore unreliable, including the ones
        that currently look healthy.
      tags:
        - tag: scope
          value: availability
    - uuid: 63832229bbaf43118c534b1adbbe9a77
      expression: 'last(/RouterFleet by Zabbix agent/routerfleet.routers)<0 or last(/RouterFleet by Zabbix agent/routerfleet.failing)<0 or last(/RouterFleet by Zabbix agent/routerfleet.hostkeys.missing)<0 or last(/RouterFleet by Zabbix agent/routerfleet.hostkeys.new)<0 or last(/RouterFleet by Zabbix agent/routerfleet.logins.failed)<0 or last(/RouterFleet by Zabbix agent/routerfleet.changes.recent)<0 or last(/RouterFleet by Zabbix agent/routerfleet.commands.failed)<0'
      name: 'RouterFleet: the collector cannot read some of its data on {HOST.NAME}'
      priority: AVERAGE
      description: |
        At least one counter reported -1: the collector reached the database
        but could not read what that counter needs - a grant from
        sql/zbx_monitor.sql that is missing, or a table this installation does
        not have. Until that is fixed, that counter says nothing, and a 0 from
        it would have looked healthy. Latest data shows which item it is.
      tags:
        - tag: scope
          value: availability
    - uuid: da97c4df53d144478ac4e9bcd3a1a75a
      expression: 'nodata(/RouterFleet by Zabbix agent/routerfleet.probe,30m)=1'
      name: 'RouterFleet: no monitoring data received'
      priority: AVERAGE
      description: 'The agent has not reported for 30 minutes.'
      tags:
        - tag: scope
          value: availability
