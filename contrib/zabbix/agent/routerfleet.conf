# RouterFleet monitoring - Zabbix agent UserParameters
#
# Install as:
#   /etc/zabbix/zabbix_agent2.d/routerfleet.conf   (agent 2)
#   /etc/zabbix/zabbix_agentd.d/routerfleet.conf   (agent 1)
# then restart the agent.
#
# UnsafeUserParameters is NOT required and must stay at 0. The only argument
# passed through is a router UUID, and the collector validates it against a
# strict pattern before it reaches SQL.
#
# The collector reads the RouterFleet database through `docker exec`, which the
# zabbix user cannot normally do. Prefer a sudoers rule scoped to this one
# script over adding that user to the docker group, which is root-equivalent:
#
#   zabbix ALL=(root) NOPASSWD: /usr/local/sbin/zbx-routerfleet.sh *
#
# and prefix each command below with `sudo -n `.

UserParameter=routerfleet.backup.discovery,/usr/local/sbin/zbx-routerfleet.sh discovery
UserParameter=routerfleet.backup.age[*],/usr/local/sbin/zbx-routerfleet.sh age "$1"
UserParameter=routerfleet.backup.result[*],/usr/local/sbin/zbx-routerfleet.sh result "$1"
UserParameter=routerfleet.probe,/usr/local/sbin/zbx-routerfleet.sh probe
UserParameter=routerfleet.routers,/usr/local/sbin/zbx-routerfleet.sh routers
UserParameter=routerfleet.failing,/usr/local/sbin/zbx-routerfleet.sh failing

# Host-key store, audit log and command jobs. A count that cannot be read is
# reported as -1, never 0, and the template alarms on it.
UserParameter=routerfleet.hostkeys.missing,/usr/local/sbin/zbx-routerfleet.sh hostkeys_missing
UserParameter=routerfleet.hostkeys.new,/usr/local/sbin/zbx-routerfleet.sh hostkeys_new
UserParameter=routerfleet.logins.failed,/usr/local/sbin/zbx-routerfleet.sh logins_failed
UserParameter=routerfleet.changes.recent,/usr/local/sbin/zbx-routerfleet.sh changes_recent
UserParameter=routerfleet.commands.failed,/usr/local/sbin/zbx-routerfleet.sh commands_failed
