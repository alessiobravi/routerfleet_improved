services:
  routerfleet-postgres:
    container_name: routerfleet-postgres
    restart: unless-stopped
    image: routerfleet-dev/routerfleet-postgres18:local
    build:
      context: ./containers/postgres18
      dockerfile: Dockerfile-postgres18
    volumes:
      # PostgreSQL 18 keeps its cluster under 18/docker in this volume
      - postgres18_data:/var/lib/postgresql
      # The PostgreSQL 16 database of earlier releases, read-only: the image
      # refuses to start empty beside it until scripts/migrate-database.sh
      # has moved it. Remove this line (and the volume) once migrated.
      - postgres_data:/var/lib/postgresql-legacy:ro
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=${TIMEZONE}
    healthcheck:
      # Ready to accept connections over TCP - not the temporary server that
      # only listens on its socket while a new database is initialised
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 900s   # the first start may move a PostgreSQL 16 database

  routerfleet:
    container_name: routerfleet
    restart: unless-stopped
    image: routerfleet-dev/routerfleet:local
    build:
      context: .
    environment:
      - SERVER_ADDRESS=${SERVER_ADDRESS}
      - DEBUG_MODE=${DEBUG_MODE}
      - HTTPS_REDIRECT_POLICY=${HTTPS_REDIRECT_POLICY}
      - UPDATE_CHECK=${UPDATE_CHECK}
      - DATABASE_ENGINE=${DATABASE_ENGINE}
      - POSTGRES_HOST=${POSTGRES_HOST:-}
      - POSTGRES_PORT=${POSTGRES_PORT:-}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=${TIMEZONE}
      - COMPOSE_VERSION=09a
      - COMPOSE_TYPE=with-postgres

    volumes:
      - sqlite_volume:/var/lib/routerfleet_sqlite/
      - media_root:/var/lib/routerfleet/
      # The discovery listener's requests, state and findings
      - discovery_data:/discovery
      - static_volume:/app_static_files/
      - app_secrets:/app_secrets/
      # Shared with nginx: HTTPS in System settings writes the mode and certificates here
      - https_cert:/certificate
    command: /bin/bash /app/init.sh
    healthcheck:
      # gunicorn answering a real page - migrations done, workers up
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/accounts/login/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Migrations of a large database can take a while on the first start
      start_period: 180s
    depends_on:
      routerfleet-postgres:
        condition: service_healthy

  routerfleet-cron:
    container_name: routerfleet-cron
    restart: unless-stopped
    image: routerfleet-dev/routerfleet-cron:local
    build:
      context: ./containers/cron
      dockerfile: Dockerfile-cron
    environment:
      - TZ=${TIMEZONE}
    depends_on:
      routerfleet:
        condition: service_healthy

  routerfleet-monitoring:
    container_name: routerfleet-monitoring
    restart: unless-stopped
    image: routerfleet-dev/routerfleet-monitoring:local
    build:
      context: ./containers/monitoring
      dockerfile: Dockerfile-monitoring
    environment:
      - TZ=${TIMEZONE}
    volumes:
      - app_secrets:/app_secrets/
    depends_on:
      routerfleet:
        condition: service_healthy

  # Discovery listener: dormant - no socket open - until "Discover adjacent
  # devices" asks for a few minutes; then it hears LLDP, CDP and MikroTik MNDP
  # on this host's LAN segment and goes quiet again. Host networking and the
  # raw-socket right only (to read layer-2 frames); it sends nothing; the
  # request and what it hears pass through a file on a shared volume.
  routerfleet-discovery:
    container_name: routerfleet-discovery
    restart: unless-stopped
    image: routerfleet-dev/routerfleet-discovery:local
    build:
      context: ./containers/discovery
      dockerfile: Dockerfile-discovery
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    read_only: true
    volumes:
      - discovery_data:/discovery

  routerfleet-nginx:
    container_name: routerfleet-nginx
    restart: unless-stopped
    image: routerfleet-dev/routerfleet-nginx:local
    build:
      context: ./containers/nginx
      dockerfile: Dockerfile-nginx
    environment:
      - HTTPS_REDIRECT_POLICY=${HTTPS_REDIRECT_POLICY}
      - TZ=${TIMEZONE}
      # The HTTPS port on the host, for the HTTP redirect (see ports below)
      - HTTPS_PORT=${HTTPS_PORT:-443}
      # Emergency override of System settings -> HTTPS (env or selfsigned)
      - HTTPS_MODE_OVERRIDE=${HTTPS_MODE_OVERRIDE:-}
      # 1: Let's Encrypt's test service
      - LETSENCRYPT_STAGING=${LETSENCRYPT_STAGING:-}
    volumes:
      - static_volume:/static
      - https_cert:/certificate
    ports:
      # The ports on the host: HTTP_PORT and HTTPS_PORT in .env
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    healthcheck:
      # Listening on 443 - which on a first start is only after the
      # self-signed certificate has been generated. Read from the kernel's
      # socket table, so it needs no tool the image does not have.
      test: ["CMD-SHELL", "grep -qE ': ?01BB +00000000:0000 +0A' /proc/net/tcp"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      routerfleet:
        condition: service_healthy

volumes:
  discovery_data:
  static_volume:
  https_cert:
  media_root:
  postgres_data:
  postgres18_data:
  sqlite_volume:
  app_secrets: