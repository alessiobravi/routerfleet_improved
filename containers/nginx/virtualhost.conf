server {
    server_tokens off;
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    server_tokens off;
    listen 443 ssl;
    ssl_certificate        /certificate/nginx.pem;
    ssl_certificate_key    /certificate/nginx.key;

    # if you are using cloudflare, you can use this enable authenticated origin pull. Dont forget to activate it in cloudflare
    #ssl_client_certificate /certificate/cloudflare_authenticated_origin_pull_ca.pem;
    #ssl_verify_client on;

    location /static/ {
        root /;
        # Text compressed; only here - a page carrying a CSRF token is never
        # compressed (BREACH)
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/css application/javascript text/javascript image/svg+xml application/json text/plain;
        # Django sends these for the pages it renders; files served here
        # directly need them from nginx
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        # A plain name may change at an update: asked again (304 when unchanged)
        add_header Cache-Control "no-cache" always;
        # A name with the hash of its content never changes: kept for a year
        location ~ "\.[0-9a-f]{12}\.[A-Za-z0-9]+$" {
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "same-origin" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
    }

    # The scheduler has its own container and calls the application directly, on
    # the internal network - these endpoints are not for browsers and carry no
    # authentication, so they are not passed on to anyone who comes in here.
    location /cron/ {
        return 404;
    }

    # The device console's WebSocket: served by uvicorn beside gunicorn
    location /console/ws/ {
        proxy_pass http://routerfleet:8002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 4h;
        proxy_send_timeout 4h;
    }

    # Firmware uploads (System settings): the only place a large body is accepted
    location = /system/firmware/upload/ {
        client_max_body_size 1024m;
        client_body_timeout 30m;
        proxy_read_timeout 30m;
        proxy_send_timeout 30m;
        proxy_pass http://routerfleet:8001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://routerfleet:8001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}