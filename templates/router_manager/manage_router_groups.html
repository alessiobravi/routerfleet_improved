{% extends 'base.html' %}

{% block content %}
<div class='row'>
    <div class='col-lg-6'>
        <div class="card card-primary card-outline">
            <div class="card-header">
                <h3 class="card-title">Manage Device Groups</h3>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-md-12">
                            <h4>Selected Devices:</h4>
                            <ul>
                                {% for router in routers %}
                                    <li>{{ router.name }}</li>
                                    <input type="hidden" name="router_uuids" value="{{ router.uuid }}">
                                {% endfor %}
                            </ul>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="add_group">Add to Group:</label>
                                <select class="form-select" id="add_group" data-rf-differs-from="remove_group" data-rf-differs-message="You cannot select the same group for both adding and removing." name="add_group">
                                    <option value="">-- Select Group --</option>
                                    {% for group in groups %}
                                        <option value="{{ group.uuid }}">{{ group.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="remove_group">Remove from Group:</label>
                                <select class="form-select" id="remove_group" data-rf-differs-from="add_group" data-rf-differs-message="You cannot select the same group for both adding and removing." name="remove_group">
                                    <option value="">-- Select Group --</option>
                                    {% for group in groups %}
                                        <option value="{{ group.uuid }}">{{ group.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <button type="submit" class="btn btn-success">Apply Changes</button>
                            <a href="/router/list/" class="btn btn-secondary"><i class="fas fa-xmark me-1" aria-hidden="true"></i>Cancel</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
