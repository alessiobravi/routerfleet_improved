{% extends 'base.html' %}
{% load custom_tags %}

{% block content %}
<div class="rf-settings">
    <a href="/backup/profile_list/" class="small"><i class="fas fa-chevron-left"></i> Backup profiles</a>
    {% if page_title %}<div class="rf-set-title">{{ page_title }}</div>{% endif %}
    {% settings_form form %}
</div>
{% endblock %}

{% block custom_page_scripts %}

    <button type="button" id="rf-delete-action" class="d-none" data-rf-post="?uuid={{ instance.uuid }}" data-rf-field-action="delete"
            data-rf-confirm-word="delete" data-rf-confirm-sum="{% if delete_confirmation_message %}{{ delete_confirmation_message }}{% else %}Delete this backup profile permanently?{% endif %}"></button>
{% endblock %}
