{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
    <div class='row'>
        <div class='{% if form_size %}{{ form_size }}{% else %}col-lg-6{% endif %}'>
            <div class="card card-primary card-outline">
                {% if page_title %}
                    <div class="card-header">
                        <h3 class="card-title">{{ page_title }}</h3>
                    </div>
                {% endif %}
                <div class="card-body row">
                    <div class="col-lg-12">
                        {% csrf_token %}
                        {% crispy form %}
                    </div>
                </div>
            </div>
        </div>
    </div>
    
{% endblock %}

{% block custom_page_scripts %}

    <button type="button" id="rf-delete-action" class="d-none" data-rf-post="?uuid={{ instance.uuid }}" data-rf-field-action="delete"
            data-rf-confirm-word="delete" data-rf-confirm-sum="{% if delete_confirmation_message %}{{ delete_confirmation_message }}{% else %}Delete this backup profile permanently?{% endif %}"></button>
{% endblock %}
