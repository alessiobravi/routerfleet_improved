{% extends "base_login.html" %}

{% load static %}
{% block content %}
<form action="/accounts/login/" method="post">
    {% csrf_token %}
    <label for="login-username" class="visually-hidden">Username</label>
    <div class="input-group">
        <input type="text" class="form-control" id="login-username" placeholder="Username" name="username"
               autocomplete="username" autocapitalize="none" spellcheck="false" autofocus>
        <div class="input-group-text"><span class="fas fa-user"></span></div>
    </div>
    <label for="login-password" class="visually-hidden">Password</label>
    <div class="input-group">
        <input type="password" class="form-control" id="login-password" placeholder="Password" name="password"
               autocomplete="current-password">
        <div class="input-group-text"><span class="fas fa-lock"></span></div>
    </div>
    <button type="submit" class="btn btn-primary w-100 mt-2"><i class="fas fa-sign-in-alt me-1"></i> Sign in</button>
    {% if password_reset %}<div class="text-center"><a href="/accounts/password_reset/" class="btn btn-link btn-sm">Forgot your password?</a></div>{% endif %}
</form>

<!-- Shown only where the browser can use a passkey here -->
<div id="passkey-area" class="d-none">
    <div class="rf-auth-divider">or</div>
    <button type="button" id="passkey-button" class="btn btn-outline-primary w-100">
        <i class="fas fa-key me-1"></i> Sign in with a passkey
    </button>
    <div id="passkey-error" class="text-danger small mt-2" role="alert"></div>
</div>

<script src="{% static 'routerfleet/passkeys.js' %}"></script>
{% endblock %}
