{% extends "base_login.html" %}

{% block content %}
<p class="rf-auth-message">Enter the code from your authenticator app</p>
<form action="/accounts/login/verify/" method="post" autocomplete="off">
    {% csrf_token %}
    <label for="verify-code" class="visually-hidden">Code</label>
    <div class="input-group">
        <input type="text" class="form-control text-center rf-code-input" id="verify-code" name="code" inputmode="numeric" pattern="[0-9 ]*"
               maxlength="7" autocomplete="one-time-code" placeholder="123456" autofocus required>
        <div class="input-group-text"><span class="fas fa-shield-alt"></span></div>
    </div>
    {% if error %}<p class="text-danger small" role="alert">{{ error }}</p>{% endif %}
    <button type="submit" class="btn btn-primary w-100 mt-2">Verify</button>
    <div class="text-center"><a href="/accounts/login/" class="btn btn-link">Back</a></div>
</form>
<p class="small text-muted text-center mb-0 mt-2">Lost your phone? An administrator can reset your second factors.</p>
{% endblock %}
