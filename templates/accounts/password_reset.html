{% extends "base_login.html" %}

{% block content %}
<p class="rf-auth-message">Reset your password</p>
<form action="/accounts/password_reset/" method="post">
    {% csrf_token %}
    <label for="reset-name" class="visually-hidden">Username or email address</label>
    <div class="input-group">
        <input type="text" class="form-control" id="reset-name" name="name" placeholder="Username or email address"
               autocomplete="username" autocapitalize="none" spellcheck="false" autofocus required>
        <div class="input-group-text"><span class="fas fa-envelope"></span></div>
    </div>
    <button type="submit" class="btn btn-primary w-100 mt-2">Send me a link</button>
    <div class="text-center"><a href="/accounts/login/" class="btn btn-link">Back to sign in</a></div>
</form>
<p class="small text-muted text-center mb-0 mt-2">The link goes to the email address of the account. Without one, an administrator sets a new password.</p>
{% endblock %}
