{% extends 'base.html' %}
{% load custom_tags %}

{% block content %}
<div class="{% if form_description %}rf-form-page{% else %}rf-settings{% endif %}">
    <div class="rf-settings">
        {% if page_title %}<div class="rf-set-title">{{ page_title }}</div>{% endif %}
        {% settings_form form %}
    </div>
    {% if form_description %}
    <div class="rf-form-help">
        <div class="rf-set-title">About this</div>
        <div class="rf-set-group">{{ form_description.content|safe }}</div>
    </div>
    {% endif %}
</div>
{% endblock %}

{% block custom_page_scripts %}
<button type="button" id="rf-delete-action" class="d-none" data-rf-post="?uuid={{ instance.uuid }}" data-rf-field-action="delete"
        data-rf-confirm-word="delete" data-rf-confirm-sum="{% if delete_confirmation_message %}{{ delete_confirmation_message }}{% else %}Delete this permanently?{% endif %}"></button>
{% endblock %}
