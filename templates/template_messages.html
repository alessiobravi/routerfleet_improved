<script src="/static/routerfleet/notify.js"></script>
{% if messages %}
    <script>
      {% for message in messages %}
        rfNotifyMessage('{{ message.tags|default:"info"|escapejs }}', '{{ message.message|escapejs }}');
      {% endfor %}
    </script>
{% endif %}

{% if form.errors %}
    <script>
        {% for field, errors in form.errors.items %}
            {% for error in errors %}
                rfNotify('danger', 'Not saved', '{{ error|escapejs }}');
            {% endfor %}
        {% endfor %}
    </script>
{% endif %}
